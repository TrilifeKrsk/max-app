<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ТРИЛАЙФ — Заказ продукции</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #F4F7F5);
            --text-color: var(--tg-theme-text-color, #2C3E35);
            --hint-color: var(--tg-theme-hint-color, #777777);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            
            --primary: #2C5E43;
            --primary-dark: #1E3F2E;
            --accent: #3B7A57;
            --border: #D2DCD5;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            padding-bottom: 90px;
        }

        /* Шапка */
        header { 
            background: var(--secondary-bg); 
            padding: 12px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.04); 
            margin-bottom: 12px; 
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .trilife-logo {
            width: 130px;
            height: auto;
            object-fit: contain;
        }
        .logo-texts { display: flex; flex-direction: column; gap: 2px; }
        .logo-title { font-size: 16px; font-weight: bold; color: var(--primary); }
        .logo-sub { font-size: 11px; color: var(--hint-color); }
        .cart-indicator { font-size: 12px; font-weight: bold; color: var(--primary); background: var(--bg-color); padding: 8px 12px; border-radius: 8px; white-space: nowrap; }

        /* Основная двухколоночная сетка */
        .workspace { 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 12px; 
            align-items: start;
        }

        @media screen and (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .card { 
            background: var(--secondary-bg); 
            padding: 14px; 
            border-radius: 12px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.04); 
            margin-bottom: 12px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Поиск и фильтры */
        .controls { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 12px; 
        }

        input, select { 
            padding: 10px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 14px; 
            width: 100%; 
            outline: none; 
            background: var(--secondary-bg);
            color: var(--text-color);
        }
        input:focus, select:focus { border-color: var(--primary); }

        /* Таблица прайса */
        .table-wrap {
            max-height: 650px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: var(--bg-color);
            color: var(--primary-dark);
            padding: 10px 8px;
            font-size: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
        }

        tr.cat-row td {
            background: var(--primary-dark);
            color: white;
            font-weight: bold;
            font-size: 12px;
            padding: 8px 10px;
        }

        .btn-add { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 6px 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 11px; 
            white-space: nowrap;
        }
        .btn-add:active { opacity: 0.8; }

        /* Блок корзины */
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px; 
            margin-bottom: 8px; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 6px; 
            gap: 8px; 
        }
        .cart-controls { display: flex; gap: 4px; align-items: center; }
        .cart-controls button { width: 24px; height: 24px; background: var(--border); color: var(--text-color); border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 13px; }
        
        .total { 
            font-size: 15px; 
            font-weight: bold; 
            display: flex; 
            justify-content: space-between; 
            margin-top: 12px; 
            border-top: 2px solid var(--border); 
            padding-top: 10px; 
            color: var(--primary-dark); 
        }

        .tier-info { 
            font-size: 11px; 
            color: var(--text-color); 
            background: var(--bg-color); 
            padding: 8px; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            text-align: center; 
            font-weight: 500; 
            line-height: 1.3; 
            border: 1px solid var(--border);
        }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px; color: var(--hint-color); }
        
        h3 { font-size: 15px; color: var(--primary-dark); margin-bottom: 10px; }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-submit:active { background: var(--primary-dark); }
    </style>
</head>

    let cart = [];

    function getPackMultiplier(item) {
        if (!item.pricePerUnit) return 1;
        const combined = (item.pack + " " + item.name).toLowerCase();
        const match = combined.match(/(\d+)\s*(пар|шт)/);
        if (match) return parseInt(match[1]);
        const numbers = item.pack.match(/\d+/);
        if (numbers) return parseInt(numbers[0]);
        return 1;
    }

    function isSutureMaterial(item) {
        const cat = item.category.toLowerCase();
        return cat.includes('полигликолид') || cat.includes('пга') || cat.includes('полипропилен');
    }

    function getPackPriceForTier(item, tier) {
        const mult = getPackMultiplier(item);
        let unitPrice = item.priceUpTo30k;

        if (isSutureMaterial(item)) {
            if (tier === 3 && item.priceOver60k !== undefined) unitPrice = item.priceOver60k;
            else if (tier === 2 && item.price30to60k !== undefined) unitPrice = item.price30to60k;
        }
        return unitPrice * mult;
    }

    function getPackBasePrice(item) {
        const mult = getPackMultiplier(item);
        return (item.priceUpTo30k || 0) * mult;
    }

    function getCartTier(currentCart) {
        let baseSum = 0;
        currentCart.forEach(x => {
            baseSum += getPackBasePrice(x) * x.qty;
        });
        if (baseSum > 60000) return 3;
        if (baseSum >= 30000) return 2;
        return 1;
    }

    function calculateCartSum(currentCart) {
        let tier = getCartTier(currentCart);
        let finalSum = 0;
        currentCart.forEach(x => {
            finalSum += getPackPriceForTier(x, tier) * x.qty;
        });
        return { sum: finalSum, tier: tier };
    }

    function init() {
        let cats = [...new Set(products.map(p => p.category))];
        let sel = document.getElementById('catSelect');
        cats.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c; opt.textContent = c;
            sel.appendChild(opt);
        });
        render(products);
    }

    function render(list) {
        let tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        let currentCat = '';
        
        list.forEach((item) => {
            if (item.category !== currentCat) {
                currentCat = item.category;
                let catRow = document.createElement('tr');
                catRow.className = 'cat-row';
                catRow.innerHTML = `<td colspan="6">${currentCat}</td>`;
                tbody.appendChild(catRow);
            }
            
            let p1 = getPackPriceForTier(item, 1);
            let p2 = getPackPriceForTier(item, 2);
            let p3 = getPackPriceForTier(item, 3);

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${item.name}</b><br><small style="color:#666">Производитель: ${item.maker}</small></td>
                <td>${item.pack}</td>
                <td><b>${p1.toLocaleString()}р.</b></td>
                <td>${p2 ? p2.toLocaleString() + 'р.' : '-'}</td>
                <td>${p3 ? p3.toLocaleString() + 'р.' : '-'}</td>
                <td><button class="btn-add" onclick="addToCart('${item.name}')">+ Упаковку</button></td>
            `;
            tbody.appendChild(tr);
        });
        updateCartUI();
    }

    function filterTable() {
        let q = document.getElementById('searchIn').value.toLowerCase();
        let cat = document.getElementById('catSelect').value;
        let res = products.filter(p => {
            let matchQ = p.name.toLowerCase().includes(q) || p.maker.toLowerCase().includes(q);
            let matchCat = (cat === 'all' || p.category === cat);
            return matchQ && matchCat;
        });
        render(res);
    }

    function addToCart(productName) {
        let item = products.find(p => p.name === productName);
        if (!item) return;
        let ex = cart.find(x => x.name === item.name);
        if (ex) { 
            ex.qty++; 
        } else { 
            cart.push({...item, qty: 1}); 
        }
        updateCartUI();
    }

    function changeQty(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        updateCartUI();
    }

    function updateCartUI() {
        let list = document.getElementById('cartList');
        let count = document.getElementById('cartCount');
        let totalEl = document.getElementById('cartTotal');
        let tierInfoEl = document.getElementById('tierInfo');
        
        count.textContent = cart.reduce((s, x) => s + x.qty, 0);
        
        if (cart.length === 0) {
            list.innerHTML = '<div style="color: #888; font-size: 13px; text-align: center; padding: 15px 0;">Корзина пуста</div>';
            totalEl.textContent = '0 руб.';
            tierInfoEl.textContent = 'Базовая цена (до 30 тыс. руб.)';
            return;
        }

        let calc = calculateCartSum(cart);
        
        if (calc.tier === 3) {
            tierInfoEl.textContent = '🔥 Скидка >60 000 ₽ активна';
        } else if (calc.tier === 2) {
            tierInfoEl.textContent = '⚡ Скидка 30–60 000 ₽ активна';
        } else {
            tierInfoEl.textContent = '💡 Базовая цена. Добавьте товаров до 30 000 ₽ для скидки!';
        }

        list.innerHTML = '';
        cart.forEach((x, i) => {
            let packPrice = getPackPriceForTier(x, calc.tier);
            let div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div style="flex:1;"><b>${x.name}</b><br><small style="color:#666">${packPrice.toLocaleString()}р. за уп. × ${x.qty} уп.</small></div>
                <div class="cart-controls">
                    <button type="button" onclick="changeQty(${i}, -1)">-</button>
                    <span>${x.qty}</span>
                    <button type="button" onclick="changeQty(${i}, 1)">+</button>
                </div>
            `;
            list.appendChild(div);
        });
        totalEl.textContent = calc.sum.toLocaleString() + ' руб.';
    }

    async function sendOrder(event) {
        event.preventDefault();
        if (cart.length === 0) { 
            alert('Корзина пуста!'); 
            return; 
        }
        
        let name = document.getElementById('cName').value;
        let phone = document.getElementById('cPhone').value;
        let org = document.getElementById('cOrg').value;
        let calc = calculateCartSum(cart);

        let baseUrl = 'https://b24-5qamxl.bitrix24.ru/rest/12/w655fv23viloze7i';
        
        let productsDetails = cart.map((c, index) => {
            let price = getPackPriceForTier(c, calc.tier);
            let itemTotal = price * c.qty;
            return `${index + 1}. ${c.name}\n   • Количество: ${c.qty} уп.\n   • Цена за уп.: ${price} руб.\n   • Сумма: ${itemTotal} руб.`;
        }).join('\n\n');

        let comment = `📥 НОВЫЙ ЗАКАЗ ИЗ TELEGRAM MINI APP\n\n` +
                      `👤 Данные клиента:\n` +
                      `• Организация: ${org || 'Не указана'}\n` +
                      `• Имя: ${name}\n` +
                      `• Телефон: ${phone}\n` +
                      `• Тип цен: ${calc.tier}\n\n` +
                      `🛒 СОСТАВ ЗАКАЗА:\n${productsDetails}\n\n` +
                      `💰 ИТОГО К ОПЛАТЕ: ${calc.sum.toLocaleString()} руб.`;

        let leadData = {
            fields: {
                TITLE: `Заказ от ${org ? org : name} — ${calc.sum.toLocaleString()} руб.`,
                NAME: name,
                PHONE: [{ VALUE: phone, VALUE_TYPE: 'WORK' }],
                OPPORTUNITY: Number(calc.sum),
                CURRENCY_ID: 'RUB',
                IS_MANUAL_OPPORTUNITY: 'Y',
                COMMENTS: comment,
                SOURCE_ID: 'WEB'
            }
        };

        try {
            let response = await fetch(`${baseUrl}/crm.lead.add.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(leadData)
            });

            let result = await response.json();

            if (result.result) {
                let leadId = result.result;
                let rows = cart.map(c => {
                    let price = getPackPriceForTier(c, calc.tier);
                    return {
                        PRODUCT_ID: 0,
                        PRODUCT_NAME: c.name,
                        PRICE: Number(price),
                        QUANTITY: Number(c.qty)
                    };
                });

                await fetch(`${baseUrl}/crm.lead.productrows.set.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: leadId, rows: rows })
                });

                alert(`Спасибо! Заказ на сумму ${calc.sum.toLocaleString()} руб. успешно создан!`);
                cart = [];
                updateCartUI();
                if (event.target && typeof event.target.reset === 'function') {
                    event.target.reset();
                }
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.close();
                }
            } else {
                alert('Ошибка от Битрикс: ' + (result.error_description || JSON.stringify(result)));
            }
        } catch (error) {
            alert('Не удалось связаться с CRM. Ошибка: ' + error.message);
        }
    }

    window.onload = init;
    </script>
</body>
